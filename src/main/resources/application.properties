# our application name market-mesh this is E-commerce application for market-mesh
spring.application.name=market-mesh

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/market_mesh?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration it is default port for spring boot application if you want to change the port you can change it here
server.port=8080 

# jwt secret key after that modification in production time you can change it to your own secret key and expiration time
jwt.secret=ThisIsASecretKeyForMarketMeshChangeItLaterInProduction123456

# jwt expiration time in milliseconds 24 hour(1 day = 86400000 milliseconds) long term valid.
jwt.expiration=86400000


